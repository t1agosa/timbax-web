<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timbax - Anotador Multijuego</title>
    <meta name="description" content="El anotador oficial de todas tus partidas de Truco, Mosca, Chinchón y Generala. Disponible para Android y iOS.">
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #F2F2F7;
            color: #272727;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: #FFFFFF;
            padding: 48px 40px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .logo-image {
            width: 100px;
            height: auto;
            margin-bottom: 16px;
        }

        .logo {
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 4px;
            color: #272727;
        }

        .tagline {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 32px;
            color: #272727;
        }

        .description {
            font-size: 17px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #636366;
        }

        .games {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #636366;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.2s ease;
            cursor: pointer;
            background: #1C1C1E;
            color: #FAFAFA;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        .btn:hover {
            background: #2C2C2E;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        .btn-icon {
            width: 24px;
            height: 24px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #E5E5EA;
            margin: 32px 0;
        }

        .legal-links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        .legal-link {
            font-size: 15px;
            color: #2979FF;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .legal-link:hover {
            opacity: 0.7;
        }

        .footer-info {
            font-size: 13px;
            line-height: 1.8;
            color: #8E8E93;
            font-weight: 400;
        }

        .footer-info p {
            margin-bottom: 4px;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .container {
                padding: 40px 28px;
                max-width: 100%;
            }

            .logo-image {
                width: 80px;
                margin-bottom: 12px;
            }

            .logo {
                font-size: 42px;
            }

            .tagline {
                font-size: 18px;
                margin-bottom: 24px;
            }

            .description {
                font-size: 15px;
            }

            .games {
                font-size: 13px;
                margin-bottom: 32px;
                line-height: 1.4;
            }

            .buttons {
                gap: 12px;
            }

            .btn {
                font-size: 15px;
                padding: 14px 24px;
            }

            .btn-icon {
                width: 20px;
                height: 20px;
            }

            .divider {
                margin: 24px 0;
            }

            .legal-links {
                gap: 12px;
                margin-bottom: 24px;
            }

            .legal-link {
                font-size: 14px;
            }

            .footer-info {
                font-size: 12px;
            }
        }

        /* Tablet adjustments */
        @media (min-width: 769px) and (max-width: 1024px) {
            .container {
                max-width: 600px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/timbax_logo.png" alt="Timbax Logo" class="logo-image">
        <h1 class="logo">TIMBAX</h1>
        <p class="tagline">Anotador Multijuego</p>
        
        <p class="description">El anotador oficial de todas tus partidas</p>
        <p class="games">TRUCO · MOSCA · CHINCHÓN · GENERALA</p>
        
       <div class="buttons">
            <a href="https://play.google.com/store/apps/details?id=com.timbax.app" class="btn">
                Descargar para Android
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/>
                </svg>
            </a>
            <a href="https://apps.apple.com/app/timbax/id0000000000" class="btn">
                Descargar para iOS
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.71,19.5C17.88,20.74 17,21.95 15.66,21.97C14.32,22 13.89,21.18 12.37,21.18C10.84,21.18 10.37,21.95 9.1,22C7.79,22.05 6.8,20.68 5.96,19.47C4.25,17 2.94,12.45 4.7,9.39C5.57,7.87 7.13,6.91 8.82,6.88C10.1,6.86 11.32,7.75 12.11,7.75C12.89,7.75 14.37,6.68 15.92,6.84C16.57,6.87 18.39,7.1 19.56,8.82C19.47,8.88 17.39,10.1 17.41,12.63C17.44,15.65 20.06,16.66 20.09,16.67C20.06,16.74 19.67,18.11 18.71,19.5M13,3.5C13.73,2.67 14.94,2.04 15.94,2C16.07,3.17 15.6,4.35 14.9,5.19C14.21,6.04 13.07,6.7 11.95,6.61C11.8,5.46 12.36,4.26 13,3.5Z"/>
                </svg>
            </a>
        </div>

        <div class="divider"></div>

        <div class="legal-links">
            <a href="/privacy-policy" class="legal-link">Política de Privacidad</a>
            <a href="/terms-of-use" class="legal-link">Términos de Uso</a>
        </div>

        <div class="divider"></div>

        <div class="footer-info">
            <p>Timbax® - Todos los derechos reservados</p>
            <p>© 2026 Tiago Salto Arce</p>
            <p>Hecho con ❤️ en Córdoba 🇦🇷</p>
        </div>
    </div>
</body>
</html>
